name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        default: desktop
        options: [desktop, all, windows, macos, ios]

permissions:
  contents: read

concurrency:
  group: yunhui-build-${{ github.ref }}-${{ github.event_name }}-${{ inputs.target || 'desktop' }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP membership and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, openssl, curl, mbstring
          coverage: none
      - run: php scripts/test-members.php
      - run: php scripts/test-member-renewal.php
      - run: php scripts/test-member-gift-policy.php
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-member-admin-policy.py
      - run: php scripts/test-catalog-sync.php
      - run: php scripts/test-server-storage.php
      - run: php scripts/test-config-concurrency.php
      - run: php scripts/test-admin-auth.php
      - run: php scripts/test-admin-session.php
      - run: php scripts/test-server-api.php
      - run: php scripts/test-catalog-publish.php

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'desktop' || inputs.target == 'all' || inputs.target == 'windows'
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium
      - name: Core features and configuration regressions
        run: node scripts/test-core-all.mjs
      - run: node scripts/test-extensions.mjs --renderer
      - run: node scripts/test-desktop-connection-launch.mjs --renderer
      - run: node scripts/make-icon.mjs build
      - run: pnpm build
      - run: node scripts/test-desktop-shell.mjs
      - name: Verify management workflows and failure recovery
        run: |
          python scripts/test-management-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-routing-groups-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-navigation-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-membership-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-client-restart-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-desktop-setup-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-client-diagnostics-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-client-connections-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-permission-restore-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-manual-guides-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-extension-connection-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-extension-snapshot-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-provider-views-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-model-context-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-model-batch-context-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-session-relations-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-session-sources-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-client-lifecycle-native.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-client-terminal-native.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-client-catalog-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-provider-sync-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-provider-balance-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-provider-balance-electron.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-update-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-plugin-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-history-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-client-history-switch-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node scripts/smoke.mjs
      - run: npx electron-builder --win --x64 --publish never
      - run: python scripts/test-packaged.py --exe release/win-unpacked/YunHuiAI.exe
      - run: python scripts/test-coexist-ui.py --exe release/win-unpacked/YunHuiAI.exe
      - name: Verify portable startup, single instance and temporary cleanup
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          python scripts/test-portable-startup.py --exe release/win-unpacked/YunHuiAI.exe --launcher "release/YunHuiAI-$releaseVersion-win-x64-portable.exe" --report-dir tmp/portable-startup-ci
      - name: Hash Windows installers and ZIP
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath release -File | Where-Object { $_.Extension -in '.exe', '.zip', '.blockmap' } | Sort-Object Name)
          if (@($packages | Where-Object Extension -eq '.exe').Count -lt 2 -or @($packages | Where-Object Extension -eq '.zip').Count -lt 1) { throw 'Missing Windows setup, portable or ZIP package' }
          $lines = $packages | ForEach-Object { ((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) + '  ' + $_.Name }
          $lines | Set-Content -LiteralPath release/SHA256SUMS-windows-x64.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: yunhui-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.zip
            release/SHA256SUMS-windows-x64.txt
          if-no-files-found: error

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'desktop' || inputs.target == 'all' || inputs.target == 'macos'
    uses: ./.github/workflows/desktop-platform-validation.yml
    with:
      package-installer: true

  ios:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'ios'))
    name: iOS companion · simulator + unsigned device
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: 安装锁定依赖并验证移动接口
        working-directory: mobile
        run: |
          npm ci
          npm test
      - name: 构建资源并生成原生工程
        working-directory: mobile
        run: |
          npm run sync:ios
      - name: 构建模拟器 App（不是可安装到真机的 IPA）
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tee build/xcodebuild.log
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release-iphonesimulator/App.app \
            build/YunHuiAI-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: yunhui-ios-simulator
          path: mobile/build/YunHuiAI-iOS-simulator.zip
          if-no-files-found: error
      - name: 构建 iPhone App（未签名，不能直接安装）
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=' build | tee build/xcodebuild-device.log
          ditto -c -k --sequesterRsrc --keepParent \
            build-device/Build/Products/Release-iphoneos/App.app \
            build/YunHuiAI-iOS-device-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: yunhui-ios-device-unsigned
          path: mobile/build/YunHuiAI-iOS-device-unsigned.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yunhui-ios-build-log
          path: mobile/build/xcodebuild*.log
          if-no-files-found: ignore

