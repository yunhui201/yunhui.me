name: Desktop platform validation

on:
  workflow_dispatch:
    inputs:
      native-only:
        description: Run only native bundle and lifecycle checks
        type: boolean
        default: false
  workflow_call:
    inputs:
      package-installer:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-platform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        if: inputs.native-only != true
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
        if: inputs.native-only != true
      - run: python -m playwright install chromium
        if: inputs.native-only != true
      - name: Verify actual native runner architecture
        run: node -e "if (process.platform !== 'darwin' || process.arch !== '${{ matrix.arch }}') process.exit(1)"
      - name: Core features and configuration regressions
        if: inputs.native-only != true
        run: node scripts/test-core-all.mjs
      - run: node scripts/test-desktop-macos.mjs
        if: ${{ !cancelled() }}
      - run: node scripts/test-client-lifecycle-macos-native.mjs
        if: ${{ !cancelled() }}
      - run: pnpm build
        id: build
        if: ${{ !cancelled() && inputs.native-only != true }}
      - run: node scripts/test-desktop-shell.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Client, plugin, history, balance and membership UI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python scripts/test-client-restart-ui.py
          python scripts/test-desktop-setup-ui.py
          python scripts/test-client-diagnostics-ui.py
          python scripts/test-client-connections-ui.py
          python scripts/test-permission-restore-ui.py
          python scripts/test-manual-guides-ui.py
          python scripts/test-extension-connection-ui.py
          python scripts/test-extension-snapshot-ui.py
          python scripts/test-provider-views-ui.py
          python scripts/test-model-context-ui.py
          python scripts/test-model-batch-context-ui.py
          python scripts/test-session-relations-ui.py
          python scripts/test-session-sources-ui.py
          python scripts/test-plugin-ui.py
          python scripts/test-history-ui.py
          python scripts/test-client-history-switch-ui.py
          python scripts/test-provider-balance-ui.py
          python scripts/test-membership-ui.py
          python scripts/test-routing-groups-ui.py
          python scripts/test-navigation-ui.py
      - name: Package native application for acceptance (no release)
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx electron-builder --mac --${{ matrix.arch }} --dir --publish never
      - name: Validate packaged native application and resources
        id: acceptance
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT=$(find release -maxdepth 2 -name '*.app' -type d -print -quit)
          test -n "$APP_ROOT"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP_ROOT/Contents/Info.plist")
          python scripts/test-packaged.py --exe "$APP_ROOT/Contents/MacOS/$EXECUTABLE"
          printf 'app-root=%s\n' "$APP_ROOT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-validation-mac-${{ matrix.arch }}
          path: docs/PACKAGED-VALIDATION-*.json
          if-no-files-found: ignore
      - name: Build DMG and ZIP when requested by the build workflow
        if: inputs.package-installer == true
        env:
          ACCEPTED_APP_ROOT: ${{ steps.acceptance.outputs.app-root }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACCEPTED_APP_ROOT"
          test -d "$ACCEPTED_APP_ROOT"
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --prepackaged "$ACCEPTED_APP_ROOT" --publish never
      - name: Hash macOS DMG and ZIP
        if: inputs.package-installer == true
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS-macos-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        if: inputs.package-installer == true
        with:
          name: yunhui-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
