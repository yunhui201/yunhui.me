name: YunHui download packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            args: --win portable --x64
            file: release/*-win-x64-portable.exe
          - os: macos-15
            target: mac-arm64
            args: --mac dmg --arm64
            file: release/*-mac-arm64.dmg
          - os: macos-15-intel
            target: mac-x64
            args: --mac dmg --x64
            file: release/*-mac-x64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Package
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Hash package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path '${{ matrix.file }}' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one package' }
          $packages | ForEach-Object { ((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) + '  ' + $_.Name } | Set-Content -LiteralPath 'release/SHA256SUMS-${{ matrix.target }}.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: yunhui-${{ matrix.target }}
          path: |
            ${{ matrix.file }}
            release/SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error
